<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>DB Bench Progress</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;background:#111;color:#eee;padding-bottom:80px}
header{padding:14px 16px;font-weight:700;font-size:20px;background:#1a1a1a}main{padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a1a1a;border-top:1px solid #333}
nav button{flex:1;padding:16px 4px;background:none;border:0;color:#aaa;font-size:15px}nav button.on{color:#4ade80;font-weight:700}
.card{background:#1e1e1e;border-radius:14px;padding:14px;margin-bottom:12px}
button.b{background:#4ade80;color:#111;border:0;border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;margin:4px 4px 4px 0}
button.g{background:#333;color:#eee}input,select,textarea{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:10px;padding:12px;font-size:18px;width:100%}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row input{width:auto;flex:1;min-width:0}
.seg button{flex:1;padding:14px;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#eee;font-size:17px}.seg button.on{background:#4ade80;color:#111;font-weight:700}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid #333}.big{font-size:24px;font-weight:700;color:#4ade80}
.muted{color:#999;font-size:14px}a{color:#4ade80}.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:#333;font-size:13px;margin-left:6px}
</style></head><body><header>DB Bench Progress</header><main id="app"></main>
<nav><button data-v="next" class="on">Next</button><button data-v="log">Log</button><button data-v="hist">History</button><button data-v="chart">Chart</button><button data-v="method">Method</button></nav>
<script>
// ---------- Pure logic (testable) ----------
const SEED=[["2026-08-10","H","75x9,85x8,95x6,90x8,80x10",""],["2026-08-12","","75x10,85x8,95x7,90x8,80x10","95 set written as 6-8 reps; logged as 7"],["2026-08-17","","75x10,85x8,95x7,90x6,80x10",""],["2026-08-21","","75x11,85x9,90x8,85x7,75x10","Date written 8/121; assumed 8/21"],["2026-08-23","H","80x9,90x7,95x4,90x7","felt weak"],["2026-08-25","H","75x10,85x8,95x7,90x8,80x10","tired"],["2026-08-27","M","75x11,85x9,90x9,85x8,75x15",""],["2026-08-31","H","80x9,90x8,95x6,95x6,90x8,80x12",""],["2026-09-02","M","75x12,85x12,90x8,85x9,75x11",""],["2026-09-07","H","75x10,85x10,95x7,90x10,80x10",""],["2026-09-16","H","75x8,85x8,95x7,90x7,80x10",""],["2026-09-18","H","80x8,90x8,100x6,90x7,80x9",""],["2026-09-21","H","75x8,85x9,95x8,100x5,80x13",""],["2026-09-23","M","75x12,85x10,90x8,85x10,75x12",""],["2026-09-28","H","75x8,85x8,95x1,90x3,80x10",""],["2026-10-05","H","75x10,85x8,90x8,90x7,80x8",""],["2026-10-07","M","75x12,85x10,90x8,85x8,75x10",""],["2026-10-09","R","75x6,85x6,90x8,85x10,75x12",""],["2026-10-13","H","80x8,90x8,95x6","No time"],["2026-10-16","","75x8,85x8,95x6,90x8,80x10",""],["2026-10-30","","70x10,85x8,90x7,95x4,75x10",""]]
 .map(([d,t,s,n])=>({id:d,date:d,type:t,notes:n,sets:s.split(',').map(x=>{const[w,r]=x.split('x').map(Number);return{w,r}})}));
const epley=(w,r)=>r>0?w*(1+r/30):0;
const r5=x=>Math.round(x/5)*5;
const best=s=>s.sets.reduce((m,x)=>{const e=epley(x.w,x.r);return e>m.e?{e,w:x.w,r:x.r}:m},{e:0});
const sortS=a=>[...a].sort((x,y)=>x.date<y.date?-1:1);
function recommend(all){
  const S=sortS(all).filter(s=>s.sets.length);if(!S.length)return{type:'H',why:'No data yet.',sets:[]};
  const last=S[S.length-1];const E=S.map(s=>best(s).e);
  const lastDeload=S.map(s=>s.type).lastIndexOf('D');
  const win=S.slice(Math.max(lastDeload+1,S.length-10));const peak=Math.max(...win.map(s=>best(s).e));
  const n=S.length, recent=E.slice(-2);
  // Deload trigger: last 2 sessions both >=5% under recent peak (no deload since)
  if(last.type!=='D'&&n>=3&&recent.every(e=>e<0.95*peak)&&lastDeload<n-2){
    const top=r5(0.85*best(S.filter(s=>s.type!=='D').slice(-1)[0]).w);
    return{type:'D',why:`Deload: best e1RM of last 2 sessions (${recent.map(e=>e.toFixed(0)).join(', ')} lb) is >5% below your recent peak (${peak.toFixed(0)} lb). One easy week (~half volume, RIR 4) lets fatigue dissipate; then resume Heavy.`,
      sets:[{w:top-10,r:8,rir:4},{w:top,r:6,rir:4},{w:top,r:6,rir:4}]};
  }
  // Alternate: after H (or deload/unlabeled heavy-ish) do M, after M/R do H
  const prevT=last.type||(Math.max(...last.sets.map(x=>x.w))>=95?'H':'M');
  const type=(prevT==='H')?'M':'H';
  const ref=[...S].reverse().find(s=>(s.type||'H')===type&&s.type!=='D')||last;
  const top=ref.sets.reduce((m,x)=>x.w>m.w||(x.w===m.w&&x.r>m.r)?x:m,{w:0,r:0});
  if(type==='H'){
    let W=top.w,R;let why;
    if(top.r>=8){W+=5;R=6;why=`Last heavy top set ${top.w}x${top.r} hit the top of 6–8 → add 5 lb, aim for 6.`}
    else if(top.r>=6){R=top.r+1;why=`Last heavy top set ${top.w}x${top.r} is inside 6–8 → same weight, beat it by 1 rep.`}
    else{W=r5(W-5);R=6;why=`Last heavy top set ${top.w}x${top.r} was under 6 reps → drop 5 lb and own 6+ clean reps.`}
    return{type,why:why+' Top set at RIR 1 (1 rep left). Ramp sets at RIR 2–3.',sets:[{w:W-20,r:10,rir:3},{w:W-10,r:8,rir:2},{w:W,r:R,rir:1},{w:W-5,r:8,rir:1},{w:W-15,r:10,rir:1}]};
  }
  let W=top.w,R;let why;
  if(top.r>=12){W+=5;R=10;why=`Last medium top set ${top.w}x${top.r} hit 12 → add 5 lb, aim for 10.`}
  else{R=Math.min(12,Math.max(10,top.r+1));if(top.r<8)W-=5;why=`Medium day: 10–12 reps at RIR 2. Last top set ${top.w}x${top.r} → aim ${R}.`}
  return{type,why,sets:[{w:W-15,r:12,rir:3},{w:W-5,r:10,rir:2},{w:W,r:R,rir:2},{w:W-5,r:10,rir:2},{w:W-15,r:12,rir:1}]};
}
// Preview upcoming day types by simulating sessions done as prescribed
function upcoming(all,k=4){let S=[...all].filter(s=>s.sets.length);const out=[];let d=S.length?sortS(S).slice(-1)[0].date:'2000-01-01';
  for(let i=0;i<k;i++){const r=recommend(S);out.push(r.type);d=d+'~';S=S.concat([{id:'sim'+i,date:d,type:r.type,sets:r.sets.map(x=>({w:x.w,r:x.r}))}])}return out}
if(typeof module!=='undefined')module.exports={SEED,recommend,upcoming,epley,best};
// ---------- UI ----------
if(typeof document!=='undefined'){
const K='benchSessions';let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}if(!db){db=SEED;save()}
function save(){localStorage.setItem(K,JSON.stringify(db))}
const $=s=>document.querySelector(s),app=$('#app');const TN={H:'Heavy',M:'Medium',R:'R',D:'Deload','':'—'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let draft=null;
const V={
 next(){const r=recommend(db);const up=upcoming(db,4);app.innerHTML=`<div class="card"><div class="muted">Coming up</div><div style="font-size:18px"><b>Next: ${TN[up[0]]}</b> → then ${up.slice(1).map(t=>TN[t]).join(' → ')}</div>${r.type==='D'?'<div class="muted">Deload because your last 2 sessions were >5% below your best.</div>':''}<div class="muted" style="font-size:12px">Preview assumes you hit today's targets; it updates after each log.</div></div><div class="card"><div class="muted">Next session</div><div class="big">${TN[r.type]} day</div><p>${esc(r.why)}</p>
 <table>${r.sets.map((s,i)=>`<tr><td>Set ${i+1}</td><td class="big" style="font-size:20px">${s.w} × ${s.r}</td><td class="muted">RIR ${s.rir}</td></tr>`).join('')}</table>
 <button class="b" id="use">Log this session</button></div><div class="card muted">Weights are per dumbbell (lb). RIR = reps in reserve. If a set feels much harder than target RIR, stop there.</div>`;
 $('#use').onclick=()=>{draft={date:new Date().toISOString().slice(0,10),type:r.type,notes:'',sets:r.sets.map(s=>({w:s.w,r:s.r}))};go('log')}},
 log(){if(!draft)draft={date:new Date().toISOString().slice(0,10),type:'H',notes:'',sets:[{w:75,r:10},{w:85,r:8},{w:95,r:6},{w:90,r:8},{w:80,r:10}]};
 app.innerHTML=`<div class="card"><label>Date<input type="date" id="dt" value="${draft.date}"></label>
 <div class="row seg">${['H','M','R','D',''].map(t=>`<button data-t="${t}" class="${draft.type===t?'on':''}">${t||'—'}</button>`).join('')}</div>
 <div id="sets">${draft.sets.map((s,i)=>`<div class="row"><span style="width:28px">${i+1}</span><button class="b g" data-i="${i}" data-f="w" data-d="-5">−</button><input inputmode="numeric" data-i="${i}" data-k="w" value="${s.w}"><button class="b g" data-i="${i}" data-f="w" data-d="5">+</button><span>×</span><button class="b g" data-i="${i}" data-f="r" data-d="-1">−</button><input inputmode="numeric" data-i="${i}" data-k="r" value="${s.r}"><button class="b g" data-i="${i}" data-f="r" data-d="1">+</button></div>`).join('')}</div>
 <button class="b g" id="add">+ Set</button><button class="b g" id="rm">− Set</button>
 <label>Notes<textarea id="nt" rows="2">${esc(draft.notes)}</textarea></label><button class="b" id="sv">Save session</button></div>`;
 const sync=()=>{draft.date=$('#dt').value;draft.notes=$('#nt').value;app.querySelectorAll('input[data-k]').forEach(x=>draft.sets[x.dataset.i][x.dataset.k]=Number(x.value)||0)};
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync();draft.type=b.dataset.t;V.log()});
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{sync();const s=draft.sets[b.dataset.i];s[b.dataset.f]=Math.max(0,s[b.dataset.f]+Number(b.dataset.d));V.log()});
 $('#add').onclick=()=>{sync();const l=draft.sets[draft.sets.length-1]||{w:75,r:10};draft.sets.push({...l});V.log()};
 $('#rm').onclick=()=>{sync();draft.sets.pop();V.log()};
 $('#sv').onclick=()=>{sync();const s={...draft,id:draft.id||Date.now().toString(),sets:draft.sets.filter(x=>x.w&&x.r)};db=db.filter(x=>x.id!==s.id);db.push(s);save();draft=null;go('hist')}},
 hist(){app.innerHTML=`<div class="card"><button class="b" id="ex">Export backup</button><button class="b g" id="im">Import backup</button><input type="file" id="f" accept=".json" hidden></div>`+
 sortS(db).reverse().map(s=>{const b=best(s);return`<div class="card"><b>${s.date}</b><span class="tag">${TN[s.type]}</span><span class="tag">e1RM ${b.e.toFixed(0)}</span><div>${s.sets.map(x=>x.w+'×'+x.r).join(', ')}</div>${s.notes?`<div class="muted">${esc(s.notes)}</div>`:''}<button class="b g" data-e="${s.id}">Edit</button><button class="b g" data-x="${s.id}">Delete</button></div>`}).join('');
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='bench-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
 $('#im').onclick=()=>$('#f').click();$('#f').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('Replace all data with '+d.length+' sessions?')){db=d;save();V.hist()}}catch(x){alert('Not a valid backup file')}};r.readAsText(e.target.files[0])};
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{draft=JSON.parse(JSON.stringify(db.find(x=>x.id===b.dataset.e)));go('log')});
 app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Delete this session?')){db=db.filter(x=>x.id!==b.dataset.x);save();V.hist()}})},
 chart(){const S=sortS(db).filter(s=>s.sets.length);if(S.length<2){app.innerHTML='<div class="card">Log 2+ sessions to see a chart.</div>';return}
 const W=360,H=240,P=34,t=S.map(s=>new Date(s.date).getTime()),e=S.map(s=>best(s).e),t0=Math.min(...t),t1=Math.max(...t),lo=Math.floor(Math.min(...e)/5)*5-5,hi=Math.ceil(Math.max(...e)/5)*5+5;
 const X=v=>P+(v-t0)/(t1-t0||1)*(W-P-8),Y=v=>H-P+-(v-lo)/(hi-lo)*(H-P-10);const col={H:'#4ade80',M:'#60a5fa',R:'#fbbf24',D:'#c084fc','':'#aaa'};
 let g='';for(let v=lo;v<=hi;v+=5)g+=`<line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#333"/><text x="2" y="${Y(v)+4}" fill="#888" font-size="10">${v}</text>`;
 app.innerHTML=`<div class="card"><div class="muted">Best-set e1RM per session (Epley), lb per DB</div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}<polyline fill="none" stroke="#4ade80" stroke-width="2" points="${S.map((s,i)=>X(t[i])+','+Y(e[i])).join(' ')}"/>${S.map((s,i)=>`<circle cx="${X(t[i])}" cy="${Y(e[i])}" r="4" fill="${col[s.type||'']}"/>`).join('')}<text x="${P}" y="${H-8}" fill="#888" font-size="10">${S[0].date}</text><text x="${W-70}" y="${H-8}" fill="#888" font-size="10">${S[S.length-1].date}</text></svg>
 <div class="muted"><span style="color:#4ade80">●</span> Heavy <span style="color:#60a5fa">●</span> Medium <span style="color:#fbbf24">●</span> R <span style="color:#c084fc">●</span> Deload <span style="color:#aaa">●</span> unlabeled</div></div>
 <div class="card">Peak: <b>${Math.max(...e).toFixed(1)} lb</b> · Latest: <b>${e[e.length-1].toFixed(1)} lb</b></div>`},
 method(){app.innerHTML=`<div class="card"><h3>The rules</h3><ol>
 <li><b>Undulate:</b> alternate Heavy (top set 6–8 reps) and Medium (10–12 reps) days, ~2×/week.</li>
 <li><b>Autoregulate with RIR:</b> top set ~1 rep in reserve, ramp sets 2–3 RIR. Don't grind to failure every session.</li>
 <li><b>Double progression:</b> same weight until you hit the top of the rep range, then +5 lb/DB and restart at the bottom. Under the range → drop 5 lb.</li>
 <li><b>Track e1RM</b> (Epley: w × (1 + reps/30)) of your best set to see the real trend through rep changes.</li>
 <li><b>Deload trigger:</b> if your last 2 sessions are both >5% below your recent peak e1RM, do one deload session/week: ~3 sets, ~85% weight, RIR 4. Log it as type D, then resume.</li></ol></div>
 <div class="card"><h3>Sources</h3><ul>
 <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4961270/">Zourdos, Helms et al. 2016 – RIR-based RPE scale for resistance training</a></li>
 <li><a href="https://www.strongerbyscience.com/autoregulation/">Stronger By Science (Greg Nuckols) – Autoregulation</a></li>
 <li><a href="https://rpstrength.com/blogs/articles/progressing-for-hypertrophy">Renaissance Periodization (Mike Israetel) – progressing for hypertrophy</a></li>
 <li><a href="https://www.biolayne.com/">Layne Norton (PH3 / PHAT power-hypertrophy undulation)</a></li></ul>
 <p class="muted">This is a training aid, not medical advice. Data stays on this phone; use Export backup regularly.</p></div>`}};
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));V[v]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));go('next');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
}
</script></body></html>
